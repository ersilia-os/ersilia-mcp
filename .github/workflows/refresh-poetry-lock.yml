name: Refresh Poetry lock

on:
  push:
    branches: [chore/ruff-0.16]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chore/ruff-0.16
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Poetry
        run: pip install poetry==2.4.1
      - name: Regenerate lockfile
        run: poetry lock
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- poetry.lock; then
            echo "poetry.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add poetry.lock
          git commit -m "chore: regenerate Poetry lockfile"
          git push origin HEAD:chore/ruff-0.16
