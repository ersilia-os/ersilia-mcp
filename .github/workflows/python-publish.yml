name: Upload Python Package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v4.0.0

      # The release tag (vX.Y.Z) must match [project].version, otherwise the
      # release is blocked rather than silently republished under another number.
      - name: Determine version
        id: get_version
        run: |
          VERSION=$(poetry version -s)
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "::error::Release tag '$GITHUB_REF_NAME' does not match pyproject.toml version '$VERSION'"
              exit 1
            fi
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version $VERSION"
      - name: Configure PyPI credentials
        run: |
          poetry config pypi-token.pypi "${{ secrets.ALL_PYPI_PROJECTS_API_TOKEN }}"
      - name: Build and publish to PyPI
        run: poetry publish --build
