name: Apply Ruff review fix

on:
  push:
    branches:
      - chore/ruff-0.16

permissions:
  contents: write

jobs:
  apply-review-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/ruff-0.16
          fetch-depth: 0

      - name: Apply reviewer-requested changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          pyproject_text = pyproject.read_text(encoding="utf-8")
          old_constraint = '  "ruff==0.16.0",'
          new_constraint = '  "ruff>=0.16.0",'
          if pyproject_text.count(old_constraint) != 1:
              raise SystemExit("Expected exactly one pinned Ruff constraint")
          pyproject.write_text(
              pyproject_text.replace(old_constraint, new_constraint),
              encoding="utf-8",
          )

          lockfile = Path("poetry.lock")
          lock_text = lockfile.read_text(encoding="utf-8")
          old_hash = "9ffd9d4b53c6285e50d47eb278306a03b1dd890d129086e305432c7d191244ce"
          new_hash = "22ba0f9e7ba8a84c6c5f32680314158ff7a23a063d1522b9d835c1e15302110c"
          if lock_text.count(old_hash) != 1:
              raise SystemExit("Expected exactly one previous Poetry content hash")
          lockfile.write_text(lock_text.replace(old_hash, new_hash), encoding="utf-8")
          PY

          git diff --check
          grep -F '"ruff>=0.16.0"' pyproject.toml
          grep -F 'content-hash = "22ba0f9e7ba8a84c6c5f32680314158ff7a23a063d1522b9d835c1e15302110c"' poetry.lock

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml poetry.lock
          git commit -m "fix: allow Ruff dependency updates"
          git push origin HEAD:chore/ruff-0.16
